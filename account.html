<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Account - ARK Form Center</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/extra.css"></head><body>
<header><b>ARK Form Center</b><div class="hbar"><a href="index.html">Back to shop</a><button class="hout" id="hOut" style="display:none" onclick="doLogout()">Log out</button></div></header>
<main>

<!-- LOGGED OUT -->
<div id="out">
 <div class="gate" id="gate" style="display:none">🔒 Please log in or create an account to place your order. Your cart is saved and will be waiting for you.</div>
 <div class="card"><h3 style="margin-top:0">Login</h3><input id="le" type="email" placeholder="Email"><input id="lp" type="password" placeholder="Password">
 <button onclick="login()">Login</button> <a href="#" onclick="reset();return false">Forgot password?</a><p id="lmsg" class="msg"></p></div><br>
 <div class="card"><h3 style="margin-top:0">Register</h3><input id="rn" placeholder="Full name"><input id="rph" type="tel" placeholder="Phone"><input id="re" type="email" placeholder="Email"><input id="rp" type="password" placeholder="Password (min 6)">
 <button onclick="register()">Create account</button><p id="rmsg" class="msg"></p></div>
</div>

<!-- LOGGED IN -->
<div id="in" style="display:none">
 <div class="acct-hero"><div class="av" id="av">A</div><div class="who"><b id="hn"></b><span id="he"></span></div><button class="btn-out" onclick="doLogout()">Log out</button></div>
 <div class="atabs" id="atabs"><button data-t="profile" onclick="showTab('profile')">👤 Profile</button><button data-t="orders" onclick="showTab('orders')">📦 My Orders</button><button data-t="addresses" onclick="showTab('addresses')">📍 Addresses</button></div>

 <div id="t-profile">
  <div class="card"><h3 style="margin-top:0">My Profile</h3><input id="pn" placeholder="Name"><input id="pph" type="tel" placeholder="Phone"><input id="pa" placeholder="Default delivery address">
  <button onclick="saveP()">Save profile</button><p id="pmsg" class="msg"></p></div>
 </div>

 <div id="t-orders">
  <h3 style="margin-top:0">My Orders &amp; Tracking</h3>
  <div id="ords"><p>Loading your orders...</p></div>
 </div>

 <div id="t-addresses">
  <div class="card"><h3 style="margin-top:0">Address book</h3><table id="alist"></table><br><input id="al" placeholder="Label (Home, Office...)"><input id="at" placeholder="Full address">
  <button onclick="addAddr()">Add address</button><p id="amsg" class="msg"></p></div>
 </div>
</div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script><script src="js/account.js"></script>
</body></html>
